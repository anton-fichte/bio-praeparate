<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- React explizit laden, damit das Custom Widget funktioniert -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/create-react-class@15.7.0/create-react-class.min.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Custom Widget mit Suchleiste
    const SearchableListControl = createReactClass({
      getInitialState: function() {
        return { query: '' };
      },
      handleSearchChange: function(e) {
        this.setState({ query: e.target.value.toLowerCase() });
      },
      render: function() {
        const listControl = CMS.getWidget('list').control;
        const query = this.state.query;

        // Standard Decap List-Widget rendern
        const originalList = React.createElement(listControl, this.props);

        // Suchfeld erstellen
        const searchBox = React.createElement('div', { style: { marginBottom: '15px' } },
          React.createElement('input', {
            type: 'text',
            placeholder: '🔍 Präparate durchsuchen...',
            value: this.state.query,
            onChange: this.handleSearchChange,
            style: {
              width: '100%',
              padding: '10px 14px',
              border: '2px solid #2563eb',
              borderRadius: '8px',
              fontSize: '15px',
              boxSizing: 'border-box',
              outline: 'none'
            }
          })
        );

        // Einträge filtern
        setTimeout(() => {
          const items = document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]');
          items.forEach(item => {
            if (item.id === 'search-container') return;
            const text = item.textContent.toLowerCase();
            if (query) {
              item.style.display = text.includes(query) ? '' : 'none';
            } else {
              item.style.display = '';
            }
          });
        }, 50);

        return React.createElement('div', { id: 'search-container' }, searchBox, originalList);
      }
    });

    // Widget im CMS registrieren
    CMS.registerWidget('searchable-list', SearchableListControl);
  </script>
</body>
</html>
