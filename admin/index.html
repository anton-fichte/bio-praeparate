<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
</head>
<body>
  <!-- Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- CMS starten -->
  <script>
    CMS.init();
  </script>

  <!-- REPARIERTE Suchleiste (Bricht React nicht mehr) -->
  <script>
    (function () {
      function initSearch() {
        // Prüft, ob wir auf der Listen-Ansicht sind
        const listItems = document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]');
        if (listItems.length === 0) return;

        // Prüfen, ob die Suchleiste schon da ist
        if (!document.getElementById('admin-praeparat-suche-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'admin-praeparat-suche-wrapper';
          
          // ABSOLUT positioniert, am body angehängt, greift nicht ins CMS ein
          wrapper.style.cssText = `
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 300px;
            z-index: 100000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 8px;
          `;

          const searchInput = document.createElement('input');
          searchInput.id = 'admin-praeparat-suche';
          searchInput.type = 'text';
          searchInput.placeholder = '🔍 Präparate filtern...';
          searchInput.style.cssText = `
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
          `;

          // Filter-Logik
          searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]');

            cards.forEach(card => {
              const text = card.textContent.toLowerCase();
              if (query === '' || text.includes(query)) {
                card.style.setProperty('display', '', 'important');
              } else {
                card.style.setProperty('display', 'none', 'important');
              }
            });
          });

          wrapper.appendChild(searchInput);
          
          // WICHTIG: Ans Ende des Dokuments anhängen, fernab von React!
          document.body.appendChild(wrapper);
        }
      }

      // Sucht nur alle 1 Sekunde (ressourcenschonender)
      setInterval(initSearch, 1000);
    })();
  </script>
</body>
</html>
