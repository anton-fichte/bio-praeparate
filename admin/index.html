<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 0; }
    .login-box { max-width: 360px; margin: 80px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .login-box h2 { margin-top: 0; color: #111827; }
    .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
    .login-box input:focus { border-color: #2563eb; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .login-box button:hover { background: #1d4ed8; }

    #admin-search-wrapper {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999999;
      width: 320px;
      max-width: calc(100vw - 48px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background: #ffffff;
      padding: 6px;
      border: 1px solid #e5e7eb;
    }
    #admin-search-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #2563eb;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      background: #ffffff;
      color: #1f2937;
    }
    #admin-search-input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    #admin-logout-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 999999;
      padding: 10px 16px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }
    #admin-logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div id="login-container" class="login-box" style="display: none;">
    <h2>Bio-Präparate Admin</h2>
    <p style="color: #6b7280; font-size: 14px;">Bitte Passwort eingeben:</p>
    <form id="login-form">
      <input type="password" id="password-input" placeholder="Passwort" required autofocus />
      <button type="submit">Anmelden</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = 'decap-cms-user';
    // TRAGE HIER DEINE WORKER-URL EIN:
    const WORKER_URL = 'https://decap-password-auth.anton-stuetzle.workers.dev/';

    // Automatische Absicherung: Falls invalide Daten im Speicher liegen, aufräumen
    try {
      const storedData = localStorage.getItem(STORAGE_KEY);
      if (storedData) {
        const parsed = JSON.parse(storedData);
        if (!parsed.token || !parsed.token.startsWith('ghp_')) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    } catch(e) {
      localStorage.removeItem(STORAGE_KEY);
    }

    if (!localStorage.getItem(STORAGE_KEY)) {
      document.getElementById('login-container').style.display = 'block';
      
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pass = document.getElementById('password-input').value.trim();
        
        try {
          const res = await fetch(`${WORKER_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
          });
          const data = await res.json();

          if (res.ok && data.token) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ token: data.token, backendName: 'github' }));
            location.reload();
          } else {
            alert(data.error || 'Ungültiges Passwort');
          }
        } catch (err) {
          alert('Verbindungsfehler zum Cloudflare Worker.');
        }
      });
    } else {
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(script);

      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'admin-logout-btn';
      logoutBtn.innerHTML = '🚪 Abmelden';
      logoutBtn.onclick = () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      };
      document.body.appendChild(logoutBtn);

      script.onload = function() {
        initSafeSearch();
      };
    }

    function initSafeSearch() {
      let filterQuery = '';

      function updateSearchUI() {
        const cards = Array.from(document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]'));
        const isListView = cards.length > 0;
        let searchWrapper = document.getElementById('admin-search-wrapper');

        if (isListView) {
          if (!searchWrapper) {
            searchWrapper = document.createElement('div');
            searchWrapper.id = 'admin-search-wrapper';

            const input = document.createElement('input');
            input.id = 'admin-search-input';
            input.type = 'text';
            input.placeholder = '🔍 Präparate durchsuchen...';
            input.value = filterQuery;

            input.addEventListener('input', (e) => {
              filterQuery = e.target.value.toLowerCase().trim();
              applyFilter();
            });

            searchWrapper.appendChild(input);
            document.body.appendChild(searchWrapper);
          }
          applyFilter();
        } else {
          if (searchWrapper) {
            searchWrapper.remove();
          }
        }
      }

      function applyFilter() {
        const cards = document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]');
        cards.forEach(card => {
          if (card.id === 'admin-search-wrapper' || card.contains(document.getElementById('admin-search-wrapper'))) return;

          const text = card.textContent.toLowerCase();
          if (filterQuery === '' || text.includes(filterQuery)) {
            card.style.setProperty('display', '', 'important');
          } else {
            card.style.setProperty('display', 'none', 'important');
          }
        });
      }

      setInterval(updateSearchUI, 500);
    }
  </script>
</body>
</html>
