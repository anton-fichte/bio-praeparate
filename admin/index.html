<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Robuste Suchleisten-Injektion -->
  <script>
    (function () {
      function initSearch() {
        // Findet den Kasten "PRÄPARATE"
        const listHeaders = Array.from(document.querySelectorAll('div, header, span'))
          .filter(el => el.children.length === 0 && el.textContent.trim().toUpperCase() === 'PRÄPARATE');

        if (listHeaders.length > 0) {
          const headerEl = listHeaders[0].closest('[class*="ControlContainer"], [class*="FieldControl"], div');

          if (headerEl && !document.getElementById("admin-praeparat-suche")) {
            const searchContainer = document.createElement("div");
            searchContainer.style.cssText = "padding: 10px 0; margin-bottom: 10px;";

            const searchInput = document.createElement("input");
            searchInput.id = "admin-praeparat-suche";
            searchInput.type = "text";
            searchInput.placeholder = "🔍 Präparate durchsuchen...";
            searchInput.style.cssText = `
              width: 100%;
              padding: 10px 14px;
              border: 2px solid #2563eb;
              border-radius: 8px;
              font-size: 15px;
              box-sizing: border-box;
              outline: none;
              box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            `;

            searchInput.addEventListener("input", (e) => {
              const filterText = e.target.value.toLowerCase().trim();
              // Alle aufklappbaren/einzelnen Listen-Blöcke ermitteln
              const items = document.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"]');

              items.forEach(item => {
                // Verhindert das Ausblenden des übergeordneten Containers
                if (item.contains(searchInput)) return;

                const text = item.textContent.toLowerCase();
                if (text.includes(filterText)) {
                  item.style.display = "";
                } else {
                  item.style.display = "none";
                }
              });
            });

            searchContainer.appendChild(searchInput);
            
            // Fügt die Suchleiste direkt unter dem "PRÄPARATE"-Titel ein
            headerEl.insertBefore(searchContainer, headerEl.children[1] || null);
          }
        }
      }

      // Prüft alle 800ms, ob das Formular geladen ist
      setInterval(initSearch, 800);
    })();
  </script>
</body>
</html>
