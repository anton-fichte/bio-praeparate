backend:
  name: git-gateway
  branch: main # Oder 'master', falls dein Branch so heißt

media_folder: "bilder"
public_folder: "bilder"

collections:
  - name: "praeparate"
    label: "Präparate-Sammlung"
    files:
      - file: "daten.json"
        label: "Alle Präparate"
        name: "praeparate_liste"
        fields:
          - label: "Präparate"
            name: "praeparate"
            widget: "list"
            summary: "{{fields.name}} (ID: {{fields.id}})"
            fields:
              - { label: "ID (z. B. 003)", name: "id", widget: "string" }
              - { label: "Name des Präparats", name: "name", widget: "string" }
              - { label: "Standort / Aufbewahrung", name: "ort", widget: "string" }
              - { label: "Stichwörter / Tags", name: "stichwoerter", widget: "list" }
              - { label: "Bild auswählen/hochladen", name: "bild", widget: "image" }
