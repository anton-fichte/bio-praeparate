<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      function initSearch() {
        // 1. Suche nach dem inneren Listen-Balken, der "3 präparate" bzw. "präparate" enthält
        const spans = Array.from(document.querySelectorAll('span, div, button'));
        const listCounterEl = spans.find(el => {
          const txt = el.textContent.trim().toLowerCase();
          return (txt.includes('präparate') || txt.includes('präparat')) && 
                 el.children.length === 0 &&
                 !el.closest('#admin-praeparat-suche-wrapper');
        });

        if (!listCounterEl) return;

        // 2. Den direkten Listen-Kasten ermitteln
        const listContainer = listCounterEl.closest('[class*="ControlContainer"], [class*="FieldControl"], [class*="ListControl"]') || listCounterEl.parentElement.parentElement;

        if (listContainer && !document.getElementById('admin-praeparat-suche')) {
          // Wrapper-Container erstellen, damit das Styling abgekapselt ist
          const wrapper = document.createElement('div');
          wrapper.id = 'admin-praeparat-suche-wrapper';
          wrapper.style.cssText = `
            width: 100%;
            padding: 8px 0;
            margin: 8px 0 12px 0;
            box-sizing: border-box;
          `;

          const searchInput = document.createElement('input');
          searchInput.id = 'admin-praeparat-suche';
          searchInput.type = 'text';
          searchInput.placeholder = '🔍 Präparate durchsuchen...';
          searchInput.style.cssText = `
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
          `;

          // Filter-Logik für die einzelnen Karten
          searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            // Findet die aufklappbaren Karten-Container in der Liste
            const cards = listContainer.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"], [class*="ListControl"] > div');

            cards.forEach(card => {
              if (card.contains(wrapper)) return;

              // Prüfen, ob es eine einzelne Karte ist
              const isCard = card.children.length > 0;
              if (isCard) {
                const text = card.textContent.toLowerCase();
                if (query === '' || text.includes(query)) {
                  card.style.setProperty('display', '', 'important');
                } else {
                  card.style.setProperty('display', 'none', 'important');
                }
              }
            });
          });

          wrapper.appendChild(searchInput);

          // 3. Platzierung: Direkt UNTER der Leiste mit dem "Add präparate +"-Button einfügen
          const targetParent = listCounterEl.closest('header, div');
          if (targetParent && targetParent.parentNode) {
            targetParent.parentNode.insertBefore(wrapper, targetParent.nextSibling);
          }
        }
      }

      setInterval(initSearch, 400);
    })();
  </script>
</body>
</html>
