name: Compress Images

on:
  push:
    branches:
      - main  # oder master (je nach Name deines Hauptbranches)
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Compress Images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Komprimiert JPEG, PNG und WebP automatisch
          jpegQuality: '80'
          pngQuality: '80'
          webpQuality: '80'
