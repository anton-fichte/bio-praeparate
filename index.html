<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Präparatesammlung</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🔬 Bio-Präparatesammlung</h1>
        <p>Digitale Übersicht aller Präparate</p>
    </header>

    <header class="header">
      <!-- Admin-Button -->
      <a href="/admin/" class="admin-button">⚙️ Admin-Bereich</a>
    </header>

    <main>
        <div class="suche">
            <input
                type="text"
                id="suchfeld"
                placeholder="Präparat suchen..."
            >
        </div>

        <div id="anzahl"></div>
        <div id="praeparate"></div>
    </main>

    <!-- Detail-Modal Popup -->
    <div id="detail-modal" class="modal hidden">
      <div class="modal-content">
        <span id="modal-close" class="modal-close">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>

    <!-- Haupt-Script als Letztes laden -->
    <script src="script.js"></script>
</body>
</html>
