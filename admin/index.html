<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'anton-fichte/bio-praeparate',
          branch: 'main',
          auth_type: 'implicit'
        },
        media_folder: 'bilder',
        public_folder: '/bilder',
        collections: [
          {
            name: 'praeparate_collection',
            label: 'Präparate',
            files: [
              {
                file: 'daten.json',
                label: 'Präparate Liste',
                name: 'praeparate_file',
                fields: [
                  {
                    label: 'Präparate',
                    name: 'praeparate',
                    widget: 'list',
                    summary: '{{fields.praeparat.id}} - {{fields.praeparat.name}} ({{fields.praeparat.ort}})',
                    fields: [
                      { label: 'ID', name: 'id', widget: 'string' },
                      { label: 'Name', name: 'name', widget: 'string' },
                      { label: 'Standort', name: 'ort', widget: 'string' },
                      { label: 'Stichwörter/Tags', name: 'stichwoerter', widget: 'list', required: false, default: [] },
                      { label: 'Bild', name: 'bild', widget: 'image', required: false }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
