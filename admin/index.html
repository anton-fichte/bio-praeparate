<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      function initSearch() {
        // Findet alle Elemente, die den Text "präparate" (Groß/Kleinschreibung egal) enthalten
        const allElements = Array.from(document.querySelectorAll('div, span, label, header'));
        
        // Findet den Hauptbalken "PRÄPARATE"
        const headerEl = allElements.find(el => {
          const txt = el.textContent.trim().toLowerCase();
          return (txt === 'präparate' || txt.includes('präparate')) && el.children.length === 0;
        });

        if (!headerEl) return;

        // Sucht den äußeren Karten-Container
        const container = headerEl.closest('[class*="ControlContainer"], [class*="FieldControl"], [class*="WidgetFolder"]') || headerEl.parentElement.parentElement;

        if (container && !document.getElementById('admin-praeparat-suche')) {
          // Erstellt die Suchleiste
          const searchInput = document.createElement('input');
          searchInput.id = 'admin-praeparat-suche';
          searchInput.type = 'text';
          searchInput.placeholder = '🔍 Präparate durchsuchen...';
          searchInput.style.cssText = `
            width: 100%;
            padding: 10px 14px;
            margin: 12px 0;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          `;

          // Filter-Funktion für die grauen Karten
          searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            // Findet die einzelnen verschachtelten Präparate-Karten
            const cards = container.querySelectorAll('[class*="ListItem"], [class*="ObjectControl"], [class*="ListControl"] > div > div');

            cards.forEach(card => {
              if (card.contains(searchInput)) return;

              // Prüft, ob es eine einzelne Präparate-Karte ist
              const isCard = card.children.length > 0;
              if (isCard) {
                const text = card.textContent.toLowerCase();
                if (query === '' || text.includes(query)) {
                  card.style.setProperty('display', '', 'important');
                } else {
                  card.style.setProperty('display', 'none', 'important');
                }
              }
            });
          });

          // Platziert das Suchfeld direkt über der Liste
          headerEl.parentElement.insertBefore(searchInput, headerEl.nextSibling);
        }
      }

      // Prüft fortlaufend, ob das Formular gerendert wurde
      setInterval(initSearch, 300);
    })();
  </script>
</body>
</html>
