backend:
  name: git-gateway
  branch: main # oder master, je nach deinem Repository

media_folder: "images" # Pfad zu den Bildern
public_folder: "/images"

collections:
  - name: "praeparate_collection"
    label: "Präparate"
    files:
      - file: "daten.json"
        label: "Präparate Liste"
        name: "praeparate_file"
        fields:
          - label: "Präparate"
            name: "praeparate"
            widget: "list"
            # PUNKT 1: Suchfelder und Anzeige-Name definieren
            summary: '{{fields.praeparat.name}} ({{fields.praeparat.ort}})'
            search_fields:
              - "praeparat.name"
              - "praeparat.ort"
              - "praeparat.stichwoerter"
              - "praeparat.id"
            fields:
              - label: "Präparat"
                name: "praeparat"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Standort", name: "ort", widget: "string" }
                  - { label: "Bild", name: "bild", widget: "image" }
                  # PUNKT 2: default: [] verhindert das "null"
                  - label: "Stichwörter/Tags"
                    name: "stichwoerter"
                    widget: "list"
                    required: false
                    default: []
