<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Präparatesammlung</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🔬 Bio-Präparatesammlung</h1>
        <p>Digitale Übersicht aller Präparate</p>
    </header>

    <header class="header">
      <!-- Neuer Admin-Button -->
      <a href="/admin/" class="admin-button">⚙️ Admin-Bereich</a>
    </header>

    <main>
        <div class="suche">
            <!-- WICHTIG: id="suchfeld" passend zum JS! -->
            <input
                type="text"
                id="suchfeld"
                placeholder="Präparat suchen..."
            >
        </div>

        <!-- Hier wird die Anzahl der Treffer reingeschrieben -->
        <div id="anzahl"></div>

        <!-- Hier werden die Karten gerendert -->
        <div id="praeparate"></div>
    </main>

    <script src="script.js"></script>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    
</body>
</html>
