backend:
  name: git-gateway
  branch: main # oder master

media_folder: "images"
public_folder: "/images"

collections:
  - name: "praeparate_collection"
    label: "Präparate"
    files:
      - file: "daten.json"
        label: "Präparate Liste"
        name: "praeparate_file"
        fields:
          - label: "Präparate"
            name: "praeparate"
            widget: "list"
            # Zusammenfassung: Zeigt ID, Name und Ort direkt in den Kacheln an
            summary: '{{fields.praeparat.id}} - {{fields.praeparat.name}} ({{fields.praeparat.ort}}) ({{fields.praeparat.stichwoerter}})'
            fields:
              - label: "Präparat"
                name: "praeparat"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Standort", name: "ort", widget: "string" }
                  - { label: "Bild", name: "bild", widget: "image", required: false }
                  - label: "Stichwörter/Tags"
                    name: "stichwoerter"
                    widget: "list"
                    required: false
                    default: []
