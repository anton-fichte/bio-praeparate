backend:
  name: git-gateway
  branch: main # oder master, je nachdem wie dein Branch heißt

media_folder: "images"
public_folder: "/images"

collections:
  - name: "praeparate_sammlung"
    label: "Präparate"
    # Suchfelder direkt für diese Collection aktivieren
    search_fields:
      - "praeparat.name"
      - "praeparat.ort"
      - "praeparat.id"
      - "praeparat.stichwoerter"
    files:
      - file: "daten.json"
        label: "Präparate verwalten"
        name: "praeparate_datei"
        fields:
          - label: "Alle Präparate"
            name: "praeparate"
            widget: "list"
            # Zeigt Name und Ort direkt in der Listen-Übersicht an
            summary: '{{fields.praeparat.name}} — 📍 {{fields.praeparat.ort}}'
            fields:
              - label: "Präparat"
                name: "praeparat"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Standort", name: "ort", widget: "string" }
                  - { label: "Bild", name: "bild", widget: "image" }
                  - label: "Stichwörter/Tags"
                    name: "stichwoerter"
                    widget: "list"
                    required: false
                    default: []
