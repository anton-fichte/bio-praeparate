backend:
  name: github
  repo: anton-fichte/bio-praeparate
  branch: main
  api_root: https://decap-password-auth.anton-stuetzle.workers.dev/api/v3

media_folder: "bilder"
public_folder: "/bilder"
max_file_size: 500000 # Begrenzung auf 500.000 Bytes (~500 KB)

collections:
  - name: "praeparate_collection"
    label: "Präparate"
    files:
      - file: "daten.json"
        label: "Präparate Liste"
        name: "praeparate_file"
        fields:
          - label: "Präparate"
            name: "praeparate"
            widget: "list"
            summary: '{{fields.id}} - {{fields.name}} ({{fields.ort}})'
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Standort", name: "ort", widget: "string" }
              - { label: "Stichwörter/Tags", name: "stichwoerter", widget: "list", required: false, default: [] }
              - { label: "Bild", name: "bild", widget: "image", required: false, hint: "Bitte Bilder vor dem Hochladen auf max. 500 KB verkleinern (z. B. via https://compressjpeg.com/ oder https://compresspng.com/)." }
