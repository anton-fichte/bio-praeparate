<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin-Bereich | Bio-Präparate</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 0; }
    .login-box { max-width: 360px; margin: 80px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .login-box h2 { margin-top: 0; color: #111827; }
    .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
    .login-box input:focus { border-color: #2563eb; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .login-box button:hover { background: #1d4ed8; }

    /* Duplikat-Warnung Styling */
    .id-duplicate-warning {
      color: #991b1b;
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 8px;
      display: block;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <button id="logout-btn" onclick="logout()" style="display: none; position: fixed; top: 15px; right: 15px; z-index: 9999; padding: 8px 14px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    Abmelden
  </button>

  <div id="login-container" class="login-box" style="display: none;">
    <h2>Bio-Präparate Admin</h2>
    <p style="color: #6b7280; font-size: 14px;">Bitte Passwort eingeben:</p>
    <form id="login-form">
      <input type="password" id="password-input" placeholder="Passwort" required autofocus />
      <button type="submit">Anmelden</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = 'decap-cms-user';
    let existingIds = new Set();

    // 1. Bereits existierende IDs aus daten.json im Hintergrund laden
    function loadExistingIds() {
      fetch('../daten.json')
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            existingIds = new Set(data.map(item => String(item.id).trim()).filter(Boolean));
          }
        })
        .catch(err => console.error("Konnte daten.json für ID-Check nicht laden:", err));
    }

    if (!localStorage.getItem(STORAGE_KEY)) {
      document.getElementById('login-container').style.display = 'block';
      
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const pass = document.getElementById('password-input').value.trim();
        if (pass) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ token: pass, backendName: 'github', login: 'admin', email: 'admin@example.com' }));
          location.reload();
        }
      });
    } else {
      document.getElementById('logout-btn').style.display = 'block';

      loadExistingIds();
      setInterval(loadExistingIds, 10000); // Alle 10s aktualisieren

      const script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(script);

      script.onload = function() {
        initDuplicateCheck();
        setInterval(checkLiveDuplicates, 500);
      };
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // 2. LIVE-CHECK: Prüft während der Eingabe, ob die ID bereits existiert
    function checkLiveDuplicates() {
      const allInputs = Array.from(document.querySelectorAll('input'));
      const idInput = allInputs.find(input => {
        if (input.id === 'password-input') return false;
        const controlPane = input.closest('[class*="ControlContainer"], [data-field-name]');
        if (!controlPane) return false;
        const fieldName = (controlPane.getAttribute('data-field-name') || '').toLowerCase();
        if (fieldName === 'id') return true;
        const label = controlPane.querySelector('label');
        if (label) {
          const text = label.textContent.trim().toLowerCase();
          return text === 'id' || text === 'id:';
        }
        return false;
      });

      if (!idInput) return;

      const val = idInput.value.trim();
      let errorMsg = idInput.parentNode.querySelector('.id-duplicate-warning');

      // Ermitteln, ob wir ein BEREITS EXISTIERENDES Präparat bearbeiten (dann ist seine eigene ID erlaubt)
      const hash = window.location.hash;
      const isEditingExisting = hash.includes('/entries/') && !hash.endsWith('/new');
      const currentSlug = isEditingExisting ? hash.split('/entries/')[1] : null;

      const isDuplicate = val && existingIds.has(val) && (val !== currentSlug);

      if (isDuplicate) {
        idInput.style.borderColor = '#dc2626';
        idInput.style.backgroundColor = '#fef2f2';

        if (!errorMsg) {
          errorMsg = document.createElement('div');
          errorMsg.className = 'id-duplicate-warning';
          idInput.parentNode.appendChild(errorMsg);
        }
        errorMsg.textContent = `⚠️ Die ID "${val}" existiert bereits für ein anderes Präparat!`;
      } else {
        idInput.style.borderColor = '';
        idInput.style.backgroundColor = '';
        if (errorMsg) errorMsg.remove();
      }

      // Speichern-Button sperren, wenn Duplikat vorliegt
      const publishBtns = document.querySelectorAll('button[class*="PublishButton"], button[data-testid="publish-button"]');
      publishBtns.forEach(btn => {
        if (isDuplicate) {
          btn.style.opacity = '0.4';
          btn.style.pointerEvents = 'none';
        } else {
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';
        }
      });
    }

    // 3. PRE-SAVE-HOOK: Letzte harte Blockade vor dem Speichern
    function initDuplicateCheck() {
      if (window.CMS) {
        window.CMS.registerEventListener({
          name: 'preSave',
          handler: ({ entry }) => {
            const data = entry.get('data').toJS();
            const newId = data.id ? String(data.id).trim() : '';
            const hash = window.location.hash;
            const isEditingExisting = hash.includes('/entries/') && !hash.endsWith('/new');
            const currentSlug = isEditingExisting ? hash.split('/entries/')[1] : null;

            if (newId && existingIds.has(newId) && newId !== currentSlug) {
              alert(`⚠️ Speichern abgebrochen!\n\nDie ID "${newId}" wird bereits verwendet.`);
              throw new Error(`Speichern wegen doppelter ID blockiert: ${newId}`);
            }
          }
        });
      }
    }

    // 4. BILD-KOMPRIMIERUNG: Verhindert riesige Foto-Uploads
    document.addEventListener('change', function(e) {
      if (e.target && e.target.type === 'file' && e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        if (e.__autoCompressed || !file.type.startsWith('image/') || file.size <= 300 * 1024) return;

        e.stopImmediatePropagation();

        autoCompressImage(file, 1600, 0.75).then(compressedFile => {
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(compressedFile);
          e.target.files = dataTransfer.files;

          const newEvent = new Event('change', { bubbles: true });
          newEvent.__autoCompressed = true;
          e.target.dispatchEvent(newEvent);
        }).catch(err => {
          console.error("Automatische Komprimierung fehlgeschlagen:", err);
        });
      }
    }, true);

    function autoCompressImage(file, maxDimension, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (!blob) return reject(new Error("Canvas-Konvertierung fehlgeschlagen"));
              const cleanName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
              const newFile = new File([blob], cleanName, { type: 'image/jpeg', lastModified: Date.now() });
              resolve(newFile);
            }, 'image/jpeg', quality);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }
  </script>
</body>
</html>
